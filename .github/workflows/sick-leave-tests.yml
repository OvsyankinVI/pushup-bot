name: Sick leave regression tests
on:
  pull_request:
    paths:
      - 'app/**'
      - 'tests/**'
      - 'main.py'
      - 'miniapp/index.html'
      - '.github/workflows/sick-leave-tests.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python -m compileall -q app main.py tests
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_sick_leave*.py' -v
