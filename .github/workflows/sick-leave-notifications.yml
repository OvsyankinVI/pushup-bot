name: Sick leave notification retry
on:
  schedule:
    # UTC; retry queued Telegram notifications every 30 minutes.
    - cron: '7,37 * * * *'
  workflow_dispatch:
jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - name: Deliver pending sick leave notifications
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Repository secret CRON_SECRET is required"
            exit 1
          fi
          curl --fail-with-body --show-error --silent --retry 3 --retry-delay 5 \
            --max-time 90 --request POST \
            --header "X-Cron-Secret: $CRON_SECRET" \
            https://pushup-bot-prod-ovi.onrender.com/cron/sick-leave-notifications
