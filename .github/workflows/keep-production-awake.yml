name: Keep production Render awake

on:
  schedule:
    # GitHub cron uses UTC. Moscow is UTC+3 year-round.
    # Every 10 minutes from 06:00 through 23:50 Moscow time.
    - cron: '*/10 3-20 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-production-render-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping production Render
        run: |
          curl --fail --silent --show-error --location \
            --connect-timeout 20 --max-time 120 \
            --retry 2 --retry-delay 5 \
            --output /dev/null \
            'https://pushup-bot-kf5u.onrender.com/'
