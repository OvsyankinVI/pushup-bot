name: Keep production Render awake

on:
  schedule:
    # UTC+3 = Moscow. Offset minute 3 to avoid GitHub Actions top-of-hour congestion.
    # 06:03, 06:13, ... 23:53 Moscow time. No pings during 00:00-06:00.
    - cron: '3-59/10 3-20 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-production-render-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping production and log HTTP status
        shell: bash
        run: |
          set -euo pipefail
          echo "Scheduled keep-alive at $(date -u +'%Y-%m-%dT%H:%M:%SZ') UTC"
          curl --fail --silent --show-error --location \
            --connect-timeout 20 --max-time 150 \
            --retry 2 --retry-delay 5 \
            --output /dev/null \
            --write-out 'HTTP %{http_code}, duration %{time_total}s\\n' \
            'https://pushup-bot-kf5u.onrender.com/'
