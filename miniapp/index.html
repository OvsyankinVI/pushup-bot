.clickable{cursor:pointer}.score-extra{color:#76d6a2;font-weight:600}.history-editor{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}.history-editor input{width:75px;background:#202b39;color:white;border:1px solid #44536b;border-radius:10px;padding:10px}.overlay{position:fixed;inset:0;background:#080b11df;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px}.dialog{width:min(100%,480px);max-height:85vh;overflow:auto;background:#1b2635;border:1px solid #43546c;border-radius:22px;padding:22px}.dialog .row{border-bottom:1px solid #344254;padding:10px 0}

activity-person.done{background:#29513c44}.history-editor input{background:var(--surface-2);color:var(--ink);border-color:var(--stroke)}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px}.theme-toggle{border:1px solid var(--stroke);background:var(--surface);color:var(--ink);padding:10px 13px;border-radius:50px;box-shadow:2px 5px 12px #0002}.hero{position:relative;overflow:hidden;padding:22px;background:linear-gradient(125deg,#3a312b,#151e24);border-radius:26px;margin:12px 0 20px;min-height:124px;box-shadow:6px 10px 23px #0003}.light .hero{background:linear-gradient(125deg,#fff2e1,#e2e6e3)}.hero-title{font-size:14px;color:var(--accent);font-weight:800;letter-spacing:1px;text-transform:uppercase}.hero-desc{font-size:22px;line-height:1.15;font-weight:800;margin-top:9px;max-width:62%}.hero svg{position:absolute;right:0;top:0;height:100%;width:45%;filter:drop-shadow(2px 5px 5px #0006)}.hero svg circle{fill:var(--accent)}.hero svg path{stroke:var(--accent);stroke-width:9;stroke-linecap:round;stroke-linejoin:round;fill:none}.light .hero-desc{color:#292e33}.avatar-upload{display:flex;align-items:center;gap:9px;margin-top:10px;font-size:12px}.avatar-upload input{display:none}.video-link{background:var(--accent);border:0;border-radius:12px;padding:8px 11px;color:#201b18;font-weight:700}.video-state{font-size:11px;color:var(--sub)}.video-player{width:100%;max-height:65vh;border-radius:14px;background:#000}.light .activity-person .state{color:#66716d}

</style><main id="app"><h1>Отжиматор 💪</h1><div class="card">Загружаем результаты…</div></main><nav class="nav" id="nav"></nav><script>
const tg=window.Telegram?.WebApp;document.body.classList.toggle('light',localStorage.getItem('pushup-theme')==='light');tg?.ready();tg?.expand();let data=null,tab=0,period='today',historyOpen=false,historyLoading=false,historyError='',viewedPerson=null,editorId=null,editValue=0;const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const names=['Рейтинг','Профиль'],icons=['🏆','👤'];function base(k,id){return +(data[k]?.[id]||0)}function extra(k,id){return +(data[k+'_manual']?.[id]||0)}function score(k,id){return base(k,id)+extra(k,id)}function scoreText(k,id){const n=base(k,id),m=extra(k,id);return n+(m?' <span class="score-extra">(+'+m+')</span>':'')}function rank(which){return [...data.members].sort((a,b)=>score(which,b.id)-score(which,a.id)||a.name.localeCompare(b.name,'ru'))}function placeRank(r,i,which){if(i<0)return 0;const val=score(which,r[i].id);return 1+new Set(r.slice(0,i).map(m=>score(which,m.id)).filter(v=>v>val)).size}function line(m,i,which){const place=placeRank(rank(which),i,which);return '<div class="row clickable" onclick="showPerson('+m.id+')"><span>'+(place<=3?['🥇','🥈','🥉'][place-1]:place)+ ' <span class="avatar">👤</span> '+esc(m.name)+'</span><strong>'+scoreText(which,m.id)+'</strong></div>'}function stat(n,label,emoji){return '<div class="card">'+emoji+'<strong>'+n+'</strong><small class="muted">'+label+'</small></div>'}function historyDateLabel(d){if(d===data.date)return 'СЕГОДНЯ';const [y,m,day]=d.split('-');return day+'.'+m+'.'+y}
function openHistoryDate(){const el=$('#history-date');if(el){try{el.showPicker()}catch(e){el.focus();el.click()}}}
async function chooseRankingPeriod(value){if(value==='today'&&data.selected_date!==data.date){await selectHistoryDate(data.date);if(historyError)return}period=value;draw()}
async function selectHistoryDate(value,fromRanking=false){viewedPerson=null;if(!/^\d{4}-\d{2}-\d{2}$/.test(value)||value>data.date)return;historyLoading=true;historyError='';draw();try{const r=await fetch('/api/miniapp?selected_date='+encodeURIComponent(value),{headers:{Authorization:'tma '+(tg?.initData||'')}});if(!r.ok)throw Error((await r.json()).detail||'Ошибка загрузки');data=await r.json();if(fromRanking)period='date'}catch(e){historyError=e.message}finally{historyLoading=false;draw()}}
async function reloadHistory(personId){historyLoading=true;historyError='';try{const r=await fetch('/api/miniapp?selected_date='+encodeURIComponent(data.selected_date||data.date)+(personId?'&participant_id='+personId:''),{headers:{Authorization:'tma '+(tg?.initData||'')}});if(!r.ok)throw Error((await r.json()).detail||'Ошибка загрузки');data=await r.json()}catch(e){historyError=e.message}finally{historyLoading=false;draw()}}
async function showPerson(id){viewedPerson=id;await reloadHistory(id)}
function closePerson(){viewedPerson=null;draw()}
function editAttempt(id){editorId=id;draw()}
async function saveAdjustment(id){const el=$('#adjust-value'),v=Number(el?.value);if(!Number.isInteger(v)||v<0||v>30){alert('Допустимо от 0 до 30');return}try{const r=await fetch('/api/miniapp/adjustment',{method:'POST',headers:{Authorization:'tma '+(tg?.initData||''),'Content-Type':'application/json'},body:JSON.stringify({attempt_id:id,manual_adjustment:v})});const result=await r.json();if(!r.ok)throw Error(result.detail||'Ошибка');editorId=null;await reloadHistory(viewedPerson);if(!result.notified)alert('Сохранено, но уведомление в чат отправить не удалось')}catch(e){alert(e.message)}}
function attemptRows(rows,editable){if(!rows.length)return '<p class="muted">В этот день подходов не было</p>';return rows.map((a,i)=>'<div class="row"><span class="muted">'+esc(a.time)+' · Подход '+(i+1)+'</span><span><strong>'+Number(a.pushup_count||0)+(a.manual_adjustment?' <span class="score-extra">(+'+a.manual_adjustment+')</span>':'')+'</strong>'+(editable?' <button class="history-button" onclick="editAttempt('+a.id+')">✏️</button>':'')+'</span></div><div class="row">'+videoControl(a)+'</div>'+(editable&&editorId===a.id?'<div class="history-editor"><span>Добавить:</span><input id="adjust-value" type="number" min="0" max="30" value="'+a.manual_adjustment+'"><button class="history-button" onclick="saveAdjustment('+a.id+')">Сохранить</button><button class="history-button" onclick="editorId=null;draw()">Отмена</button></div>':'')).join('')}
function avatar(id,cl='avatar'){const url=data.photo_urls?.[String(id)];return '<span class="'+cl+'">'+(url?'<img src="'+esc(url)+'" alt="Аватар" loading="lazy">':'👤')+'</span>'}
function toggleTheme(){const light=!document.body.classList.contains('light');document.body.classList.toggle('light',light);localStorage.setItem('pushup-theme',light?'light':'dark');draw()}
function hero(){return '<div class="hero"><div class="hero-title">YOUR CHALLENGE · ОТЖИМАТОР</div><div class="hero-desc">Каждое повторение имеет значение.</div><svg viewBox="0 0 210 130" aria-hidden="true"><circle cx="126" cy="38" r="17"/><path d="M108 58L70 81L119 88L155 61M70 81L41 112M119 88L165 112M156 61L183 98"/></svg></div>'}
async function uploadMyPhoto(input){const file=input.files?.[0];if(!file)return;if(file.size>2000000){alert('Максимум 2 МБ');return}try{const r=await fetch('/api/miniapp/avatar',{method:'PUT',headers:{Authorization:'tma '+(tg?.initData||''),'Content-Type':file.type},body:file});const out=await r.json();if(!r.ok)throw Error(out.detail||'Не удалось загрузить фото');data.photo_urls=data.photo_urls||{};data.photo_urls[String(data.user.id)]=out.photo_url;draw()}catch(e){alert(e.message)}}
function playVideo(id){const a=[...(data.attempts||[]),...(data.viewed_attempts||[])].find(a=>a.id===id);if(!a?.video_url)return;const v=document.createElement('div');v.className='overlay';v.innerHTML='<div class="dialog"><div class="history-actions"><h2>Видеокружок</h2><button class="history-button" id="close-video">✕</button></div><video class="video-player" controls autoplay playsinline></video></div>';document.body.appendChild(v);v.querySelector('video').src=a.video_url;v.querySelector('#close-video').onclick=()=>v.remove();v.onclick=e=>{if(e.target===v)v.remove()}}
function videoControl(a){if(a.video_url)return '<button class="video-link" onclick="playVideo('+a.id+')">▶ Видео</button>';if(a.video_status==='expired')return '<span class="video-state">Видео удалено · 5 дней</span>';if(a.video_status==='failed')return '<span class="video-state">Видео недоступно</span>';return '<span class="video-state">⏳ Видео обрабатывается</span>'}
function draw(){if(!data)return;const me=data.user.id,day=score('today',me),sorted=rank('today'),leader=score('today',sorted[0]?.id),pos=placeRank(sorted,sorted.findIndex(m=>m.id===me),'today'),stats=data.stats;let html='';if(tab===0){html='<div class="topline"><h1>Рейтинг 🏆</h1><button class="theme-toggle" onclick="toggleTheme()">'+(document.body.classList.contains('light')?'🌙':'☀️')+'</button></div>'+hero()+'<div class="tabs ranking-tabs">'+[['today','Сегодня'],['week','Неделя'],['month','Месяц']].map(([k,v])=>'<button class="'+(period===k?'selected':'')+'" onclick="chooseRankingPeriod(\''+k+'\')">'+v+'</button>').join('')+'<label class="ranking-date-tab '+(period==='date'?'selected':'')+'"><span>'+(period==='date'?(data.selected_date||data.date).slice(8,10)+'.'+(data.selected_date||data.date).slice(5,7):'📅 Дата')+'</span><input aria-label="Выбрать дату рейтинга" type="date" max="'+data.date+'" value="'+(data.selected_date||data.date)+'" onchange="selectHistoryDate(this.value,true)"></label></div>';const rankingKey=period==='date'?'today':period;const r=rank(rankingKey),podiumMembers=r.map((m,i)=>({m,place:placeRank(r,i,rankingKey)})).filter(x=>x.place<=3).sort((a,b)=>a.place-b.place);html+='<div class="podium">'+podiumMembers.map(({m,place})=>'<div class="podium-place '+(place===1?'winner':'')+'"><div style="font-size:38px">'+['🥇','🥈','🥉'][place-1]+'</div><p>'+esc(m.name)+'</p><strong>' +scoreText(rankingKey,m.id)+'</strong></div>').join('')+'</div><div class="card list">'+r.map((m,i)=>line(m,i,rankingKey)).join('')+'</div>'}if(tab===1){const days=Array.from({length:30},(_,i)=>{const d=new Date(data.date+'T12:00:00');d.setDate(d.getDate()-(29-i));return d.toISOString().slice(0,10)}),vals=days.map(d=>(data.daily[d]||0)+(data.daily_manual?.[d]||0)),max=Math.max(1,...vals);html='<div class="topline"><h1>Профиль 👤</h1><button class="theme-toggle" onclick="toggleTheme()">'+(document.body.classList.contains('light')?'🌙':'☀️')+'</button></div><div class="card"><div class="profile-heading">'+avatar(me)+'<div><h2>'+esc(data.user.name)+'</h2><span class="muted">'+esc(data.user.username?'@'+data.user.username:'Участник соревнования')+'</span></div></div><label class="avatar-upload history-button">📷 Изменить фото <input type="file" accept="image/jpeg,image/png,image/webp" onchange="uploadMyPhoto(this)"></label></div>'+'<div class="card"><div class="history-actions"><span class="muted">МОЙ РЕЗУЛЬТАТ '+historyDateLabel(data.selected_date||data.date)+'</span><input aria-label="Выбрать дату" title="Выбрать дату" id="history-date" class="history-date" type="date" max="'+data.date+'" value="'+(data.selected_date||data.date)+'" onchange="selectHistoryDate(this.value)"></div><div class="big">'+scoreText('today',me)+'</div><div class="muted">отжиманий</div><div class="row"><button class="history-button" onclick="historyOpen=!historyOpen;draw()">Детали '+(historyOpen?'▴':'▾')+'</button><span class="muted">'+(data.attempts||[]).length+' подходов</span></div>'+(historyError?'<div class="history-error">'+esc(historyError)+'</div>':'')+(historyLoading?'<p class="muted">Загружаем…</p>':historyOpen?'<div class="history-list">'+attemptRows(data.attempts||[],true)+'</div>':'')+(data.selected_date===data.date?'<p class="pill">🏅 '+pos+'-е место из '+sorted.length+'</p><div class="row"><span>'+day+'</span><span>'+leader+'</span></div><div class="bar"><div class="fill" style="width:'+Math.min(100,leader?day/leader*100:0)+'%"></div></div><p>🎯 '+(leader>day?'Ещё '+(leader-day+1)+' отжиманий до лидерства!':'Ты на вершине!')+'</p>':'')+'</div>'+ '<h2>МОИ РЕЗУЛЬТАТЫ</h2><div class="statgrid">'+stat(stats.total,'Всего отжиманий','💪')+stat(stats.best_single,'Лучший подход','🏆')+stat(stats.this_week,'За эту неделю','📅')+stat(stats.best_week,'Лучшая неделя','🔥')+'</div><div class="card"><h2>ДИНАМИКА ЗА 30 ДНЕЙ</h2><div class="bars">'+vals.map((v,i)=>'<div title="'+days[i]+': '+v+' отж." style="height:'+(v?Math.max(3,v/max*100):0)+'%"></div>').join('')+'</div></div><div class="card"><h2>КАЛЕНДАРЬ ОТЖИМАНИЙ</h2><div class="heat">'+Array.from({length:70},(_,i)=>{const d=new Date(data.date+'T12:00:00');d.setDate(d.getDate()-69+i);const k=d.toISOString().slice(0,10),v=(data.daily[k]||0)+(data.daily_manual?.[k]||0);return '<i class="'+(v>30?'high':v>0?'on':'')+'" title="'+k+': '+v+'"></i>'}).join('')+'</div><p class="muted">Цвет показывает количество засчитанных отжиманий.</p></div>'}if(viewedPerson!==null){const person=data.members.find(m=>m.id===viewedPerson);const viewedBase=base('today',viewedPerson),viewedExtra=extra('today',viewedPerson);html+='<div class="overlay" onclick="if(event.target===this)closePerson()"><div class="dialog"><div class="history-actions"><h2>'+esc(person?.name||'Участник')+'</h2><button class="history-button" onclick="closePerson()">✕</button></div><p class="muted">Подходы за '+historyDateLabel(data.selected_date||data.date)+'</p><h2>'+viewedBase+(viewedExtra?' (+'+viewedExtra+')':'')+' = '+(viewedBase+viewedExtra)+' отж.</h2>'+attemptRows(data.viewed_attempts||[],viewedPerson===data.user.id)+'</div></div>'}$('#app').innerHTML=html;$('#nav').innerHTML=names.map((n,i)=>'<button class="'+(tab===i?'active':'')+'" onclick="tab='+i+';draw()"><b>'+icons[i]+'</b>'+n+'</button>').join('')}fetch('/api/miniapp',{headers:{Authorization:'tma '+(tg?.initData||'')}}).then(async r=>{if(!r.ok)throw Error((await r.json()).detail||'Ошибка');return r.json()}).then(d=>{data=d;draw()}).catch(e=>{$('#app').innerHTML='<h1>Отжиматор 💪</h1><div class="card error">'+esc(e.message)+'<p class="muted">Открой приложение через бота Отжиматор в Telegram.</p></div>'});
