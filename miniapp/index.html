<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Отжиматор</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;color:#f7f8fc;background:#0c1018}*{box-sizing:border-box}body{margin:0}main{max-width:520px;margin:auto;padding:24px 18px 110px}h1{font-size:30px;margin:16px 0 24px}h2{font-size:17px;margin:0 0 16px}.muted{color:#9ba4b6}.card{background:linear-gradient(145deg,#1c2430,#111820);border:1px solid #2b3542;border-radius:25px;padding:22px;margin:14px 0}.big{font-size:78px;font-weight:800;letter-spacing:-4px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0}.pill{background:#263243;border-radius:16px;padding:12px}.blue{color:#58aaff}.bar{height:9px;background:#303946;border-radius:20px;overflow:hidden}.fill{height:100%;background:#58aaff}.tabs{display:flex;background:#202835;border-radius:16px;padding:5px;gap:4px}.tabs button{flex:1;background:none;border:0;color:#aab4c3;padding:12px 3px;border-radius:12px}.tabs .selected{background:#3b4658;color:white}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#151c27;border-top:1px solid #303945;padding:12px 6px calc(12px + env(safe-area-inset-bottom))}.nav button{flex:1;background:none;border:0;color:#9ba4b6;font-size:12px}.nav button.active{color:#58aaff}.nav b{display:block;font-size:24px;margin-bottom:6px}.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.statgrid .card{margin:0}.statgrid strong{display:block;font-size:28px;margin:8px 0}.podium{display:flex;align-items:end;justify-content:center;gap:8px;padding:35px 0 5px;overflow-x:auto}.podium>.podium-place{flex:1;min-width:0;text-align:center;border-radius:20px 20px 0 0;background:#263241;padding:20px 5px}.podium .winner{background:linear-gradient(#73592a,#32291c);padding-top:55px}.podium .tied-players{display:grid;grid-template-columns:repeat(var(--tied-count),minmax(0,1fr));gap:6px}.podium .tied-player{min-width:0;overflow-wrap:anywhere}.podium .tied-player p{font-size:clamp(10px,2.6vw,15px)}.podium .tied-player strong{font-size:clamp(16px,4vw,28px)}.podium strong{display:block;font-size:28px}.list .row{border-bottom:1px solid #303945;padding:10px 0}.list .row:last-child{border:0}.bars{display:flex;align-items:end;gap:5px;height:170px;border-bottom:1px solid #435062}.bars div{flex:1;min-width:3px;background:#58aaff;border-radius:5px 5px 0 0}.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:5px}.heat i{aspect-ratio:1;background:#2c3642;border-radius:4px}.heat i.on{background:#43bc78}.heat i.high{background:#79f29e}.error{color:#ffb4b4}.avatar{display:inline-grid;place-items:center;background:#35445a;border-radius:50%;width:48px;height:48px;font-size:25px}
.activity-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:16px 0}.activity-person{display:flex;align-items:center;gap:9px;min-width:0;background:#202b39;border:1px solid #344052;border-radius:15px;padding:11px 9px}.activity-person.done{border-color:#285940;background:#182e29}.activity-person .status{font-size:19px}.activity-person .name{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.activity-person .state{font-size:11px;color:#a4afbe;margin-top:3px}.activity-person.done .state{color:#77d9a4}.profile-heading{display:flex;align-items:center;gap:16px}.profile-heading h2{margin:0 0 5px}.profile-heading .avatar{width:62px;height:62px}
</style><main id="app"><h1>Отжиматор 💪</h1><div class="card">Загружаем результаты…</div></main><nav class="nav" id="nav"></nav><script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();let data=null,tab=0,period='today';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const names=['Рейтинг','Профиль'],icons=['🏆','👤'];function rank(which){return [...data.members].sort((a,b)=>(+data[which][b.id]||0)-(+data[which][a.id]||0)||a.name.localeCompare(b.name,'ru'))}function placeRank(r,i,which){return 1+r.findIndex(m=>(+data[which][m.id]||0)===(+data[which][r[i].id]||0))}function line(m,i,which){const place=placeRank(rank(which),i,which);return '<div class="row"><span>'+(place<=3?['🥇','🥈','🥉'][place-1]:place)+ ' <span class="avatar">👤</span> '+esc(m.name)+'</span><strong>'+ (data[which][m.id]||0)+'</strong></div>'}function stat(n,label,emoji){return '<div class="card">'+emoji+'<strong>'+n+'</strong><small class="muted">'+label+'</small></div>'}function draw(){if(!data)return;const me=data.user.id,day=data.today[me]||0,sorted=rank('today'),leader=data.today[sorted[0]?.id]||0,pos=placeRank(sorted,sorted.findIndex(m=>m.id===me),'today'),stats=data.stats;let html='';if(tab===0){html='<h1>Рейтинг 🏆</h1><div class="tabs">'+[['today','Сегодня'],['week','Неделя'],['month','Месяц']].map(([k,v])=>'<button class="'+(period===k?'selected':'')+'" onclick="period=\''+k+'\';draw()">'+v+'</button>').join('')+'</div>';const r=rank(period),groups=[];r.forEach((m,i)=>{const place=placeRank(r,i,period);if(place<=3){let group=groups.find(g=>g.place===place);if(!group){group={place,players:[]};groups.push(group)}group.players.push(m)}});html+='<div class="podium">'+[2,1,3].map(place=>{const g=groups.find(x=>x.place===place);return g?'<div class="podium-place '+(place===1?'winner':'')+'"><div style="font-size:38px">'+['🥇','🥈','🥉'][place-1]+'</div><div class="tied-players" style="--tied-count:'+g.players.length+'">'+g.players.map(m=>'<div class="tied-player"><p>'+esc(m.name)+'</p><strong>'+(data[period][m.id]||0)+'</strong></div>').join('')+'</div></div>':''}).join('')+'</div><div class="card list">'+r.map((m,i)=>line(m,i,period)).join('')+'</div>'}if(tab===1){const days=Array.from({length:30},(_,i)=>{const d=new Date(data.date+'T12:00:00');d.setDate(d.getDate()-(29-i));return d.toISOString().slice(0,10)}),vals=days.map(d=>data.daily[d]||0),max=Math.max(1,...vals);html='<h1>Профиль 👤</h1><div class="card"><div class="profile-heading"><span class="avatar">👤</span><div><h2>'+esc(data.user.name)+'</h2><span class="muted">'+esc(data.user.username?'@'+data.user.username:'Участник соревнования')+'</span></div></div></div>'+'<div class="card"><div class="muted">МОЙ РЕЗУЛЬТАТ СЕГОДНЯ</div><div class="big">'+day+'</div><div class="muted">отжиманий</div><p class="pill">🏅 '+pos+'-е место из '+sorted.length+'</p><div class="row"><span>'+day+'</span><span>'+leader+'</span></div><div class="bar"><div class="fill" style="width:'+Math.min(100,leader?day/leader*100:0)+'%"></div></div><p>🎯 '+(leader>day?'Ещё '+(leader-day+1)+' отжиманий до лидерства!':'Ты на вершине!')+'</p></div>'+ '<h2>МОИ РЕЗУЛЬТАТЫ</h2><div class="statgrid">'+stat(stats.total,'Всего отжиманий','💪')+stat(stats.best_single,'Лучший подход','🏆')+stat(stats.this_week,'За эту неделю','📅')+stat(stats.best_week,'Лучшая неделя','🔥')+'</div><div class="card"><h2>ДИНАМИКА ЗА 30 ДНЕЙ</h2><div class="bars">'+vals.map((v,i)=>'<div title="'+days[i]+': '+v+' отж." style="height:'+(v?Math.max(3,v/max*100):0)+'%"></div>').join('')+'</div></div><div class="card"><h2>КАЛЕНДАРЬ ОТЖИМАНИЙ</h2><div class="heat">'+Array.from({length:70},(_,i)=>{const d=new Date(data.date+'T12:00:00');d.setDate(d.getDate()-69+i);const k=d.toISOString().slice(0,10),v=data.daily[k]||0;return '<i class="'+(v>30?'high':v>0?'on':'')+'" title="'+k+': '+v+'"></i>'}).join('')+'</div><p class="muted">Цвет показывает количество засчитанных отжиманий.</p></div>'}$('#app').innerHTML=html;$('#nav').innerHTML=names.map((n,i)=>'<button class="'+(tab===i?'active':'')+'" onclick="tab='+i+';draw()"><b>'+icons[i]+'</b>'+n+'</button>').join('')}fetch('/api/miniapp',{headers:{Authorization:'tma '+(tg?.initData||'')}}).then(async r=>{if(!r.ok)throw Error((await r.json()).detail||'Ошибка');return r.json()}).then(d=>{data=d;draw()}).catch(e=>{$('#app').innerHTML='<h1>Отжиматор 💪</h1><div class="card error">'+esc(e.message)+'<p class="muted">Открой приложение через бота Отжиматор в Telegram.</p></div>'});
</script></html>
