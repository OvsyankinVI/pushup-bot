<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Отжиматор</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;color:#f7f8fc;background:#0c1018}*{box-sizing:border-box}body{margin:0}main{max-width:520px;margin:auto;padding:24px 18px 110px}h1{font-size:30px;margin:16px 0 24px}h2{font-size:17px;margin:0 0 16px}.muted{color:#9ba4b6}.card{background:linear-gradient(145deg,#1c2430,#111820);border:1px solid #2b3542;border-radius:25px;padding:22px;margin:14px 0}.big{font-size:78px;font-weight:800;letter-spacing:-4px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0}.pill{background:#263243;border-radius:16px;padding:12px}.blue{color:#58aaff}.bar{height:9px;background:#303946;border-radius:20px;overflow:hidden}.fill{height:100%;background:#58aaff}.tabs{display:flex;background:#202835;border-radius:16px;padding:5px;gap:4px}.tabs button{flex:1;background:none;border:0;color:#aab4c3;padding:12px 3px;border-radius:12px}.tabs .selected{background:#3b4658;color:white}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#151c27;border-top:1px solid #303945;padding:12px 6px calc(12px + env(safe-area-inset-bottom))}.nav button{flex:1;background:none;border:0;color:#9ba4b6;font-size:12px}.nav button.active{color:#58aaff}.nav b{display:block;font-size:24px;margin-bottom:6px}.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.statgrid .card{margin:0}.statgrid strong{display:block;font-size:28px;margin:8px 0}.podium{display:flex;align-items:end;justify-content:flex-start;gap:8px;padding:35px 0 5px;overflow-x:auto;-webkit-overflow-scrolling:touch}.podium>.podium-place{flex:1 0 105px;min-width:105px;max-width:180px;text-align:center;border-radius:20px 20px 0 0;background:#263241;padding:20px 5px;overflow-wrap:anywhere}.podium .winner{background:linear-gradient(#73592a,#32291c);padding-top:55px}.podium .podium-place p{font-size:clamp(11px,2.8vw,15px)}.podium strong{display:block;font-size:28px}.list .row{border-bottom:1px solid #303945;padding:10px 0}.list .row:last-child{border:0}.bars{display:flex;align-items:end;gap:5px;height:170px;border-bottom:1px solid #435062}.bars div{flex:1;min-width:3px;background:#58aaff;border-radius:5px 5px 0 0}.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:5px}.heat i{aspect-ratio:1;background:#2c3642;border-radius:4px}.heat i.on{background:#43bc78}.heat i.high{background:#79f29e}.error{color:#ffb4b4}.avatar{display:inline-grid;place-items:center;background:#35445a;border-radius:50%;width:48px;height:48px;font-size:25px}
.activity-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:16px 0}.activity-person{display:flex;align-items:center;gap:9px;min-width:0;background:#202b39;border:1px solid #344052;border-radius:15px;padding:11px 9px}.activity-person.done{border-color:#285940;background:#182e29}.activity-person .status{font-size:19px}.activity-person .name{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.activity-person .state{font-size:11px;color:#a4afbe;margin-top:3px}.activity-person.done .state{color:#77d9a4}.profile-heading{display:flex;align-items:center;gap:16px}.profile-heading h2{margin:0 0 5px}.profile-heading .avatar{width:62px;height:62px}
.history-actions{display:flex;align-items:center;justify-content:space-between;gap:10px}.history-actions .muted{font-size:13px}.history-button{background:#263b54;color:#d9eaff;border:1px solid #405777;border-radius:12px;padding:9px 12px;font:inherit;cursor:pointer}.history-date{max-width:145px;color-scheme:dark;background:#263b54;color:#fff;border:1px solid #405777;border-radius:10px;padding:8px}.history-list{margin-top:14px;border-top:1px solid #354052}.history-list .row{margin:0;padding:13px 0;border-bottom:1px solid #303945}.history-list .row:last-child{border:0}.history-error{color:#ffb4b4;font-size:13px;margin-top:8px}
</style><main id="app"><h1>Отжиматор 💪</h1><div class="card">Загружаем результаты…</div></main><nav class="nav" id="nav"></nav><script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();let data=null,tab=0,period='today',historyOpen=false,historyLoading=false,historyError='';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const names=['Рейтинг','Профиль'],icons=['🏆','👤'];function rank(which){return [...data.members].sort((a,b)=>(+data[which][b.id]||0)-(+data[which][a.id]||0)||a.name.localeCompare(b.name,'ru'))}function placeRank(r,i,which){if(i<0)return 0;const score=+data[which][r[i].id]||0;return 1+new Set(r.slice(0,i).map(m=>+data[which][m.id]||0).filter(v=>v>score)).size}function line(m,i,which){const place=placeRank(rank(which),i,which);return '<div class="row"><span>'+(place<=3?['🥇','🥈','🥉'][place-1]:place)+ ' <span class="avatar">👤</span> '+esc(m.name)+'</span><strong>'+ (data[which][m.id]||0)+'</strong></div>'}function stat(n,label,emoji){return '<div class="card">'+emoji+'<strong>'+n+'</strong><small class="muted">'+label+'</small></div>'}function historyDateLabel(d){if(d===data.date)return 'СЕГОДНЯ';const [y,m,day]=d.split('-');return day+'.'+m+'.'+y}
function openHistoryDate(){const el=$('#history-date');if(el){try{el.showPicker()}catch(e){el.focus();el.click()}}}
async function selectHistoryDate(value){if(!/^\d{4}-\d{2}-\d{2}$/.test(value)||value>data.date)return;historyLoading=true;historyError='';draw();try{const r=await fetch('/api/miniapp?selected_date='+encodeURIComponent(value),{headers:{Authorization:'tma '+(tg?.initData||'')}});if(!r.ok)throw Error((await r.json()).detail||'Ошибка загрузки');data=await r.json()}catch(e){historyError=e.message}finally{historyLoading=false;draw()}}
function draw(){if(!data)return;const me=data.user.id,day=data.today[me]||0,sorted=rank('today'),leader=data.today[sorted[0]?.id]||0,pos=placeRank(sorted,sorted.findIndex(m=>m.id===me),'today'),stats=data.stats;let html='';if(tab===0){html='<h1>Рейтинг 🏆</h1><div class="tabs">'+[['today','Сегодня'],['week','Неделя'],['month','Месяц']].map(([k,v])=>'<button class="'+(period===k?'selected':'')+'" onclick="period=\''+k+'\';draw()">'+v+'</button>').join('')+'</div>';const r=rank(period),podiumMembers=r.map((m,i)=>({m,place:placeRank(r,i,period)})).filter(x=>x.place<=3).sort((a,b)=>a.place-b.place);html+='<div class="podium">'+podiumMembers.map(({m,place})=>'<div class="podium-place '+(place===1?'winner':'')+'"><div style="font-size:38px">'+['🥇','🥈','🥉'][place-1]+'</div><p>'+esc(m.name)+'</p><strong>'+(data[period][m.id]||0)+'</strong></div>').join('')+'</div><div class="card list">'+r.map((m,i)=>line(m,i,period)).join('')+'</div>'}if(tab===1){const days=Array.from({length:30},(_,i)=>{const d=new Date(data.date+'T12:00:00');d.setDate(d.getDate()-(29-i));return d.toISOString().slice(0,10)}),vals=days.map(d=>data.daily[d]||0),max=Math.max(1,...vals);html='<h1>Профиль 👤</h1><div class="card"><div class="profile-heading"><span class="avatar">👤</span><div><h2>'+esc(data.user.name)+'</h2><span class="muted">'+esc(data.user.username?'@'+data.user.username:'Участник соревнования')+'</span></div></div></div>'+'<div class="card"><div class="history-actions"><span class="muted">МОЙ РЕЗУЛЬТАТ '+historyDateLabel(data.selected_date||data.date)+'</span><input aria-label="Выбрать дату" title="Выбрать дату" id="history-date" class="history-date" type="date" max="'+data.date+'" value="'+(data.selected_date||data.date)+'" onchange="selectHistoryDate(this.value)"></div><div class="big">'+(data.selected_total??day)+'</div><div class="muted">отжиманий</div><div class="row"><button class="history-button" onclick="historyOpen=!historyOpen;draw()">Детали '+(historyOpen?'▴':'▾')+'</button><span class="muted">'+(data.attempts||[]).length+' подходов</span></div>'+(historyError?'<div class="history-error">'+esc(historyError)+'</div>':'')+(historyLoading?'<p class="muted">Загружаем…</p>':historyOpen?'<div class="history-list">'+((data.attempts||[]).length?(data.attempts||[]).map((a,i)=>'<div class="row"><span class="muted">'+esc(a.time)+' · Подход '+(i+1)+'</span><strong>'+Number(a.pushup_count||0)+' отж.</strong></div>').join(''):'<p class="muted">В этот день подходов не было</p>')+'</div>':'')+(data.selected_date===data.date?'<p class="pill">🏅 '+pos+'-е место из '+sorted.length+'</p><div class="row"><span>'+day+'</span><span>'+leader+'</span></div><div class="bar"><div class="fill" style="width:'+Math.min(100,leader?day/leader*100:0)+'%"></div></div><p>🎯 '+(leader>day?'Ещё '+(leader-day+1)+' отжиманий до лидерства!':'Ты на вершине!')+'</p>':'')+'</div>'+ '<h2>МОИ РЕЗУЛЬТАТЫ</h2><div class="statgrid">'+stat(stats.total,'Всего отжиманий','💪')+stat(stats.best_single,'Лучший подход','🏆')+stat(stats.this_week,'За эту неделю','📅')+stat(stats.best_week,'Лучшая неделя','🔥')+'</div><div class="card"><h2>ДИНАМИКА ЗА 30 ДНЕЙ</h2><div class="bars">'+vals.map((v,i)=>'<div title="'+days[i]+': '+v+' отж." style="height:'+(v?Math.max(3,v/max*100):0)+'%"></div>').join('')+'</div></div><div class="card"><h2>КАЛЕНДАРЬ ОТЖИМАНИЙ</h2><div class="heat">'+Array.from({length:70},(_,i)=>{const d=new Date(data.date+'T12:00:00');d.setDate(d.getDate()-69+i);const k=d.toISOString().slice(0,10),v=data.daily[k]||0;return '<i class="'+(v>30?'high':v>0?'on':'')+'" title="'+k+': '+v+'"></i>'}).join('')+'</div><p class="muted">Цвет показывает количество засчитанных отжиманий.</p></div>'}$('#app').innerHTML=html;$('#nav').innerHTML=names.map((n,i)=>'<button class="'+(tab===i?'active':'')+'" onclick="tab='+i+';draw()"><b>'+icons[i]+'</b>'+n+'</button>').join('')}fetch('/api/miniapp',{headers:{Authorization:'tma '+(tg?.initData||'')}}).then(async r=>{if(!r.ok)throw Error((await r.json()).detail||'Ошибка');return r.json()}).then(d=>{data=d;draw()}).catch(e=>{$('#app').innerHTML='<h1>Отжиматор 💪</h1><div class="card error">'+esc(e.message)+'<p class="muted">Открой приложение через бота Отжиматор в Telegram.</p></div>'});
</script></html>
